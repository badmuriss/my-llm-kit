name: Runtime checks

on:
  pull_request:
    paths:
      - 'skills/agent-graph/**'
      - 'skills/impl/**'
      - 'skills/spec/**'
      - 'requirements-dev.txt'
      - 'ruff.toml'
      - '.github/workflows/runtime-checks.yml'

permissions:
  contents: read

concurrency:
  group: runtime-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s skills/agent-graph/tests -p 'test_routing.py' -v
      - run: python -m unittest discover -s skills/agent-graph/tests -p 'test_runtime_pin.py' -v
      - run: python -m unittest discover -s skills/spec/tests -v

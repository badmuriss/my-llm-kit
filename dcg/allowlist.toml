# dcg allowlist. Every entry is narrow and has its reason spelled out.
#
# An allowlisted rule is OFF, not softened, so this file stays short on purpose.
# Before adding one, check that no safer path exists: friction with a working
# alternative is not a reason to disable a rule.

[[allow]]
rule = "cdn.cloudflare_workers:wrangler-semantic-unverified"
reason = "catch-all that denied every `npx -y <pkg>`, including packages with no relation to wrangler (it blocked the anydoc converter the ingest skill shells out to). The concrete d1/r2/kv rules stay active and were re-verified after allowlisting this one."
added_by = "badmuriss"
added_at = "2026-08-07T13:49:37Z"
